<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة البث المباشر</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #videoContainer { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
        video { width: 90%; max-width: 800px; border: 2px solid #333; border-radius: 10px; background: #000; }
        .controls { margin-top: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #e50914; color: white; font-weight: bold; margin: 5px; }
        button:hover { background: #b80710; }
        #status { color: #aaa; margin-top: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>غرفة الرعب الخاصة</h1>
    <div id="status">جاري الاتصال بالسيرفر...</div>
    
    <div class="controls" id="hostControls" style="display:none;">
        <button onclick="startBroadcast()">بدء بث الشاشة والمايك</button>
        <button onclick="toggleMic()">تشغيل/إيقاف المايك</button>
    </div>

    <div id="videoContainer">
        <video id="remoteVideo" autoplay playsinline controls></video>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'obada-default-room';
        const isHost = urlParams.get('host') === 'true';

        if (isHost) {
            document.getElementById('hostControls').style.display = 'block';
        }

        // إضافة سيرفرات STUN المجانية لتجاوز جدار الحماية والراوتر
        const peerOptions = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        const peer = new Peer(isHost ? roomId + '-host' : null, peerOptions);
        let localStream;

        peer.on('open', (id) => {
            if (!isHost) {
                document.getElementById('status').innerText = "متصل بالسيرفر. جاري الاتصال بالكمبيوتر...";
                connectToHost();
            } else {
                document.getElementById('status').innerText = "جاهز للبث (الكمبيوتر). اضغط على 'بدء بث الشاشة والمايك'";
            }
        });

        async function startBroadcast() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                localStream = new MediaStream([...screenStream.getTracks(), ...micStream.getAudioTracks()]);
                
                // الاستماع لاتصالات المشاهدين
                peer.on('call', (call) => {
                    call.answer(localStream);
                    document.getElementById('status').innerText = "تم اتصال المشاهد بنجاح!";
                });

                document.getElementById('status').innerText = "البث شغال وجاري الانتظار...";
            } catch (err) {
                alert("خطأ في بدء البث: " + err);
            }
        }

        function connectToHost() {
            // إنشاء اتصال فارغ لإرسال طلب للكمبيوتر
            const emptyStream = new MediaStream();
            const call = peer.call(roomId + '-host', emptyStream);
            
            call.on('stream', (remoteStream) => {
                const remoteVideo = document.getElementById('remoteVideo');
                remoteVideo.srcObject = remoteStream;
                document.getElementById('status').innerText = "تم عرض البث بنجاح! استمتعوا.";
            });

            call.on('error', (err) => {
                document.getElementById('status').innerText = "فشل الاتصال. تأكد أن الكمبيوتر بدأ البث أولاً.";
            });
        }

        function toggleMic() {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
                alert("تم تغيير حالة المايك");
            }
        }
    </script>
</body>
</html>
