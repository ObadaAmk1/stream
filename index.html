<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; }
        #videoContainer { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; border: 2px solid #333; border-radius: 10px; background: #000; }
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #e50914; color: white; }
    </style>
</head>
<body>
    <h1>غرفة الرعب الخاصة</h1>
    <div id="videoContainer">
        <video id="myVideo" autoplay muted></video>
        <video id="remoteVideo" autoplay></video>
    </div>
    <div class="controls">
        <button onclick="startStream()">بدء البث الحي</button>
        <button onclick="toggleMic()">تشغيل/إيقاف المايك</button>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        let localStream;
        const peer = new Peer(); // إنشاء المعرف تلقائياً

        async function startStream() {
            // التقاط الشاشة (صوت أصلي) + المايك
            const screenStream = await navigator.mediaDevices.getDisplayMedia({
                video: true, audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            // دمج الصوتين
            localStream = new MediaStream([...screenStream.getTracks(), ...micStream.getAudioTracks()]);
            document.getElementById('myVideo').srcObject = localStream;
            
            // البث لأي متصل
            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', stream => document.getElementById('remoteVideo').srcObject = stream);
            });
        }

        function toggleMic() {
            localStream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
        }
    </script>
</body>
</html>
