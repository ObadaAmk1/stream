<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة البث المباشر</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #videoContainer { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 20px; }
        video { width: 90%; max-width: 800px; border: 2px solid #333; border-radius: 10px; background: #000; }
        .controls { margin-top: 20px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #e50914; color: white; font-weight: bold; margin: 5px; }
        button:hover { background: #b80710; }
        #status { color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>غرفة البث الخاصة</h1>
    <div id="status">جاري الاتصال بالسيرفر...</div>
    
    <div class="controls" id="hostControls" style="display:none;">
        <button onclick="startBroadcast()">بدء بث الشاشة والمايك</button>
        <button onclick="toggleMic()">تشغيل/إيقاف المايك</button>
    </div>

    <div id="videoContainer">
        <!-- شاشة العرض للمشاهد (الهاتف) -->
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        // تحديد هوية الغرفة تلقائياً من الرابط (مثلاً: موقعك.com/?room=obada123)
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'obada-default-room';

        document.getElementById('status').innerText = "معرف الغرفة: " + roomId;

        // هل أنت المرسل (الكمبيوتر) أم المشاهد (الهاتف)؟
        // افتراضياً الكمبيوتر يفتح الرابط مع كلمة ?host=true
        const isHost = urlParams.get('host') === 'true';

        if (isHost) {
            document.getElementById('hostControls').style.display = 'block';
        }

        const peer = new Peer(isHost ? roomId + '-host' : null);
        let localStream;

        peer.on('open', (id) => {
            if (!isHost) {
                // إذا كنت الهاتف، اتصل فوراً بالكمبيوتر (Host)
                document.getElementById('status').innerText = "متصل بالسيرفر. جاري الاتصال بالبث...";
                connectToHost();
            } else {
                document.getElementById('status').innerText = "أنت البث الأساسي (الكمبيوتر). اضغط بدء البث.";
            }
        });

        async function startBroadcast() {
            try {
                const screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: true, 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                const micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                localStream = new MediaStream([...screenStream.getTracks(), ...micStream.getAudioTracks()]);
                
                // استقبال أي مشاهد يتصل
                peer.on('call', (call) => {
                    call.answer(localStream);
                });

                document.getElementById('status').innerText = "البث شغال الآن! بانتظار المشاهد...";
            } catch (err) {
                alert("خطأ في بدء البث: " + err);
            }
        }

        function connectToHost() {
            // الهاتف يتصل بالـ ID الخاص بالكمبيوتر
            const call = peer.call(roomId + '-host', new MediaStream());
            call.on('stream', (remoteStream) => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
                document.getElementById('status').innerText = "تمت المتصل بنجاح! استمتع بالسهرة.";
            });
            call.on('error', (err) => {
                document.getElementById('status').innerText = "فشل الاتصال بالبث. تأكد أن الكمبيوتر بدأ البث.";
            });
        }

        function toggleMic() {
            if (localStream) {
                localStream.getAudioTracks().forEach(track => track.enabled = !track.enabled);
                alert("تم تبديل حالة المايك");
            }
        }
    </script>
</body>
</html>
